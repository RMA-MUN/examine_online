dependencies = [
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.11",
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "openai>=2.21.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-ai>=1.63.0",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
