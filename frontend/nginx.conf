server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存（index.html 除外，nginx 默认不缓存 html 即可）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
